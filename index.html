:root[data-theme=light]{color-scheme:light;--bg:#F3F5F7;--ink:#14181d;--g1:#1b2129;--g2:#6f8798;--card:#e4e9ee;--c1:#e9edf1;--c2:#c3cfd9;--line:rgba(20,24,29,.14)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Outfit','Cairo',sans-serif;color:var(--ink);overflow-x:clip;transition:background .3s,color .3s}
main{overflow-x:clip}
html[dir=rtl] *{letter-spacing:0!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hh{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-f]{opacity:0;transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
[data-f].in{opacity:1;transform:none!important}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font:500 clamp(.75rem,1.6vw,1rem) Outfit,Cairo,sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:14px 32px;cursor:pointer;background:transparent;opacity:.85;transition:opacity .2s,background .2s,color .2s}
.btn:hover{opacity:1;background:var(--ink);color:var(--bg)}
.lg{display:block;background:var(--ink);-webkit-mask:var(--m-icon) center/contain no-repeat;mask:var(--m-icon) center/contain no-repeat;aspect-ratio:1.285;width:76px}
.lg.full{-webkit-mask-image:var(--m-full);mask-image:var(--m-full);aspect-ratio:1.481;width:min(300px,70vw)}
/* toggles */
.tg{position:fixed;z-index:50;bottom:calc(52px + env(safe-area-inset-bottom,0px));right:16px;left:auto;display:flex;gap:10px;direction:ltr}
.tg button{position:relative;width:56px;height:56px;padding:0;border-radius:50%;border:none;background:transparent;color:var(--ink);font:700 .72rem Outfit,Cairo,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.04em;transform:none;isolation:isolate;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .25s,transform .15s}
.tg button::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--led-angle,0deg),transparent 0deg,transparent 250deg,rgba(160,170,180,.15) 280deg,rgba(200,210,220,.95) 310deg,rgba(160,170,180,.15) 340deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:ledSpin 2.4s linear infinite;z-index:-1;pointer-events:none}
.tg button::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(180,190,200,.25);background:rgba(255,255,255,.04);z-index:-1;pointer-events:none}
.tg button:hover{color:#fff}
.tg button:hover::after{background:rgba(255,255,255,.1);border-color:rgba(200,210,220,.4)}
.tg button:active{transform:scale(.92)}
.tg button.pulse{animation:tgBounce .48s cubic-bezier(.22,1.2,.36,1) both}
@keyframes tgBounce{0%{transform:scale(1)}28%{transform:scale(.88)}62%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ledSpin{to{--led-angle:360deg}}
@property --led-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
/* footer ticker — always LTR so both scripts stay visible */
.ticker{position:relative;z-index:2;background:#fff;color:#0a0a0a;overflow:hidden;padding:12px 0;border-top:1px solid rgba(0,0,0,.08);direction:ltr}
.ticker-track{display:flex;width:max-content;animation:tickerMove 32s linear infinite;direction:ltr}

/* hero */
#hero{position:relative;min-height:100vh;display:flex;flex-direction:column}

.hwrap{overflow:hidden}
h1{margin-top:40px;width:100%;text-align:center;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1.1;font-size:13vw}

.mag{will-change:transform}
.photo{display:grid;place-items:center;aspect-ratio:1/1;width:100%;border-radius:28px;border:2px dashed var(--ink);background:var(--card);cursor:pointer;overflow:hidden;position:relative;text-align:center;padding:12px;font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;line-height:1.5}

/* marquee */
#mq{direction:ltr;padding:96px 0 40px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.row{display:flex;gap:12px;will-change:transform}
.tile{flex:none;width:420px;height:270px;border-radius:16px}
/* about */

/* contact */
#contact{display:flex;flex-direction:column;align-items:center;gap:28px;padding:100px 20px 140px;text-align:center}
#contact p{font-weight:300;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.9rem,1.6vw,1.25rem)}
.wa-ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#25D366;box-shadow:0 8px 30px rgba(37,211,102,.35);transition:transform .2s}

.social{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px}
.social-row{display:flex;gap:20px;align-items:center;justify-content:center}
.soc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;position:relative;isolation:isolate;transition:transform .2s}

.soc:hover svg{transform:scale(1.12) rotate(-6deg)}
.soc-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);box-shadow:0 8px 28px rgba(214,36,159,.35)}
.soc-tk{background:#010101;box-shadow:0 8px 28px rgba(37,244,238,.28)}
.soc-tk svg{width:40px;height:40px}

.steps li:first-child{border-top:0}

.steps h3{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.2vw,1.5rem);margin-bottom:8px}
.steps p{font-weight:300;line-height:1.7;opacity:.75;font-size:clamp(.9rem,1.6vw,1.1rem)}

/* ===== animations ===== */
:root{--wa:#25D366}
/* hero: shimmering gradient title */
h1.hh{background-size:100% 200%;animation:shimmer 6s ease-in-out infinite alternate}
@keyframes shimmer{from{background-position:0 0}to{background-position:0 100%}}
/* floating logo */
.mag{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* nav + toggles entrance */
.tg{animation:popIn .8s .6s cubic-bezier(.22,1,.36,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
/* button shine sweep */
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 3.6s 1.5s ease-in-out infinite;z-index:-1}
@keyframes sweep{0%{left:-60%}55%,100%{left:140%}}
.btn:active{transform:scale(.96)}
/* cards: staggered entrance + hover lift + glow */
.cube{transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s,border-color .45s,opacity .9s cubic-bezier(.22,1,.36,1),filter .9s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
.cube::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 0%,rgba(187,204,215,.22),transparent 60%);opacity:0;transition:opacity .45s}
.cube:hover{transform:translateY(-8px) scale(1.02)!important;border-color:var(--g2);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.cube:hover::before{opacity:1}
.cube>*{position:relative}
/* steps: slide in + number pop */
.steps li{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),filter .9s}
.steps li.in .n{animation:numPop .8s .15s cubic-bezier(.34,1.56,.64,1) both}
@keyframes numPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* ===== extra motion ===== */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.star.s3{width:1.5px;height:1.5px;opacity:.28}
@keyframes twinkle{from{opacity:.12;transform:scale(.75)}to{opacity:.85;transform:scale(1.25)}}
main{position:relative;z-index:1}
.tg{z-index:50}

(function(){const box=$('#stars');if(!box)return;const N=28,h=[];
for(let i=0;i<N;i++){const side=i%4;let t,l;
if(side===0){t=2+Math.random()*16;l=Math.random()*100}
else if(side===1){t=82+Math.random()*16;l=Math.random()*100}
else if(side===2){t=Math.random()*100;l=1.5+Math.random()*11}
else{t=Math.random()*100;l=87+Math.random()*11}
const sz=Math.random()<.25?'s2':(Math.random()<.4?'s3':'');

box.innerHTML=h.join('')})();
(function(){const box=$('#ambient');if(!box||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const n=4,orbs=[];
for(let i=0;i<n;i++){const el=document.createElement('div');el.className='orb';
const size=90+Math.random()*100;
el.style.width=size+'px';el.style.height=size+'px';
el.style.opacity=String(.5+Math.random()*.4);

function place(el,instant){const x=-10+Math.random()*110,y=-10+Math.random()*110;
const t=(1.6+Math.random()*2.2).toFixed(2)+'s';
const sc=(.6+Math.random()*.7).toFixed(2);
el.style.transition=instant?'none':'left '+t+' linear, top '+t+' linear, transform '+t+' linear';
el.style.left=x+'%';el.style.top=y+'%';el.style.transform='scale('+sc+')';
if(instant)void el.offsetWidth}
orbs.forEach(o=>place(o,true));

setTimeout(tick,900+Math.random()*1200)}

// smooth scroll links
function goTo(id){const el=document.getElementById(id);if(!el)return;const y0=scrollY,t0=performance.now(),dur=Math.min(1600,Math.max(700,Math.abs(el.getBoundingClientRect().top)*.45)),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 R.style.scrollBehavior='auto';
 const step=now=>{const p=Math.min(1,(now-t0)/dur),r=el.getBoundingClientRect(),target=r.top+scrollY-(innerHeight-r.height)/2;window.scrollTo(0,y0+(target-y0)*ease(p));if(p<1)requestAnimationFrame(step);else R.style.scrollBehavior=''};
 requestAnimationFrame(step)}
document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goTo(a.dataset.go)}));

function initF(root=document){root.querySelectorAll('[data-f]').forEach(e=>{e.style.transform=`translate(${e.dataset.x||0}px,${e.dataset.y||30}px)`;e.style.transitionDelay=(e.dataset.d||0)+'s';io.observe(e)})}

// ---- Thank-you video: chroma key + play with sound when scrolled into view ----
(function(){
const kv=document.getElementById('kv'),kc=document.getElementById('kc'),snd=document.getElementById('snd'),kit=document.getElementById('kit');
const kx=kc.getContext('2d',{willReadFrequently:true});
let inView=false,looping=false;
function key(){if(!kv.videoWidth)return;if(kc.width!==kv.videoWidth){kc.width=kv.videoWidth;kc.height=kv.videoHeight}
 const W=kc.width,H=kc.height;kx.drawImage(kv,0,0,W,H);const im=kx.getImageData(0,0,W,H),d=im.data;
 for(let i=0;i<d.length;i+=4){const g=d[i+1],m=d[i]>d[i+2]?d[i]:d[i+2],k=g-m;
  if(k>18){let a=1-(k-18)/42;if(a<0)a=0;d[i+3]=a*255;d[i+1]=m}}
 kx.putImageData(im,0,0)}
function loop(){if(!inView){looping=false;return}key();if(kv.requestVideoFrameCallback)kv.requestVideoFrameCallback(loop);else requestAnimationFrame(loop)}
function start(){if(!looping){looping=true;loop()}if(!kv.paused)return;kv.muted=false;
 const pr=kv.play();if(pr&&pr.then)pr.then(()=>{snd.hidden=true}).catch(()=>{kv.muted=true;const p2=kv.play();if(p2&&p2.catch)p2.catch(()=>{});})}
function unmute(){if(inView&&kv.muted){kv.muted=false;const p=kv.play();if(p&&p.catch)p.catch(()=>{});snd.hidden=true}}
kv.addEventListener('loadeddata',key);
new IntersectionObserver(es=>es.forEach(e=>{inView=e.isIntersecting&&e.intersectionRatio>=.4;if(inView)start();else kv.pause()}),{threshold:[0,.4,.7,1]}).observe(kit);
let primed=false;
['click','pointerup','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!primed){primed=true;if(!inView){kv.muted=true;const p=kv.play();if(p&&p.then)p.then(()=>{if(!inView)kv.pause()}).catch(()=>{})}}unmute()},{passive:true}));
snd.addEventListener('click',unmute);
})();
