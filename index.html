<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed -- Programmer & Web Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0C0C0C;--ink:#D7E2EA;--g1:#646973;--g2:#BBCCD7;--card:#15171b;--c1:#15181d;--c2:#323b47;--line:rgba(215,226,234,.14);--m-icon:url("m-icon.webp");--m-full:url("m-full.webp")}
:root[data-theme=light]{color-scheme:light;--bg:#F3F5F7;--ink:#14181d;--g1:#1b2129;--g2:#6f8798;--card:#e4e9ee;--c1:#e9edf1;--c2:#c3cfd9;--line:rgba(20,24,29,.14)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Outfit','Cairo',sans-serif;color:var(--ink);overflow-x:clip;transition:background .3s,color .3s}
main{overflow-x:clip}
html[dir=rtl] *{letter-spacing:0!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.hh{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-f]{opacity:0;transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
[data-f].in{opacity:1;transform:none!important}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font:500 clamp(.75rem,1.6vw,1rem) Outfit,Cairo,sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:14px 32px;cursor:pointer;background:transparent;opacity:.85;transition:opacity .2s,background .2s,color .2s}
.btn:hover{opacity:1;background:var(--ink);color:var(--bg)}
.lg{display:block;background:var(--ink);-webkit-mask:var(--m-icon) center/contain no-repeat;mask:var(--m-icon) center/contain no-repeat;aspect-ratio:1.285;width:76px}
.lg.full{-webkit-mask-image:var(--m-full);mask-image:var(--m-full);aspect-ratio:1.481;width:min(300px,70vw)}
/* toggles */
.tg{position:fixed;z-index:50;bottom:calc(52px + env(safe-area-inset-bottom,0px));right:16px;left:auto;display:flex;gap:10px;direction:ltr}
.tg button{position:relative;width:56px;height:56px;padding:0;border-radius:50%;border:none;background:transparent;color:var(--ink);font:700 .72rem Outfit,Cairo,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.04em;transform:none;isolation:isolate;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .25s,transform .15s}
.tg button::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--led-angle,0deg),transparent 0deg,transparent 250deg,rgba(160,170,180,.15) 280deg,rgba(200,210,220,.95) 310deg,rgba(160,170,180,.15) 340deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:ledSpin 2.4s linear infinite;z-index:-1;pointer-events:none}
.tg button::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(180,190,200,.25);background:rgba(255,255,255,.04);z-index:-1;pointer-events:none}
.tg button:hover{color:#fff}
.tg button:hover::after{background:rgba(255,255,255,.1);border-color:rgba(200,210,220,.4)}
.tg button:active{transform:scale(.92)}
.tg button.pulse{animation:tgBounce .48s cubic-bezier(.22,1.2,.36,1) both}
@keyframes tgBounce{0%{transform:scale(1)}28%{transform:scale(.88)}62%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes ledSpin{to{--led-angle:360deg}}
@property --led-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
/* footer ticker — always LTR so both scripts stay visible */
.ticker{position:relative;z-index:2;background:#fff;color:#0a0a0a;overflow:hidden;padding:12px 0;border-top:1px solid rgba(0,0,0,.08);direction:ltr}
.ticker-track{display:flex;width:max-content;animation:tickerMove 32s linear infinite;direction:ltr}
.ticker-track span{flex:none;padding:0 2.2rem;font:600 .85rem Outfit,Cairo,sans-serif;letter-spacing:.04em;white-space:nowrap;color:#0a0a0a}
@keyframes tickerMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* hero */
#hero{position:relative;min-height:100vh;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0}
nav a{color:var(--ink);text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:.85rem;transition:opacity .2s}
nav a:hover{opacity:.7}
.hwrap{overflow:hidden}
h1{margin-top:40px;width:100%;text-align:center;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1.1;font-size:13vw}
.bar{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 24px 28px}
.bar p{max-width:160px;font-weight:300;text-transform:uppercase;letter-spacing:.025em;line-height:1.35;font-size:clamp(.75rem,1.4vw,1.5rem)}
.portrait{--w:300px;margin:auto;width:min(var(--w),52vh)}
.mag{will-change:transform}
.photo{display:grid;place-items:center;aspect-ratio:1/1;width:100%;border-radius:28px;border:2px dashed var(--ink);background:var(--card);cursor:pointer;overflow:hidden;position:relative;text-align:center;padding:12px;font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;line-height:1.5}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo.has{border-style:solid}
/* marquee */
#mq{direction:ltr;padding:96px 0 40px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.row{display:flex;gap:12px;will-change:transform}
.tile{flex:none;width:420px;height:270px;border-radius:16px}
/* about */
h2{font-weight:900;text-transform:uppercase;line-height:1.1;letter-spacing:-.025em;text-align:center;font-size:clamp(3rem,12vw,160px)}
#about{display:flex;flex-direction:column;align-items:center;gap:40px;padding:80px 20px}
#at{max-width:560px;text-align:center;font-weight:500;line-height:1.8;font-size:clamp(1rem,2vw,1.35rem)}
#at span{opacity:0;display:inline}
.cubes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:1000px}
.cube{aspect-ratio:1;border-radius:28px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;color:var(--ink);text-align:start;background:linear-gradient(150deg,var(--c1),var(--c2));border:1px solid var(--line)}
.cube h3{font-weight:600;text-transform:uppercase;font-size:clamp(.85rem,1.6vw,1.15rem);line-height:1.25}
.cube p{font-weight:300;font-size:clamp(.72rem,1.2vw,.9rem);line-height:1.45;opacity:.9}
/* contact */
#contact{display:flex;flex-direction:column;align-items:center;gap:28px;padding:100px 20px 140px;text-align:center}
#contact p{font-weight:300;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.9rem,1.6vw,1.25rem)}
.wa-ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#25D366;box-shadow:0 8px 30px rgba(37,211,102,.35);transition:transform .2s}
.wa-ic:hover{transform:scale(1.08)}
.wa-ic svg{width:54px;height:54px}
.social{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:8px}
.social-row{display:flex;gap:20px;align-items:center;justify-content:center}
.soc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;position:relative;isolation:isolate;transition:transform .2s}
.soc:hover{transform:scale(1.08)}
.soc svg{width:36px;height:36px;transition:transform .3s}
.soc:hover svg{transform:scale(1.12) rotate(-6deg)}
.soc-ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%);box-shadow:0 8px 28px rgba(214,36,159,.35)}
.soc-tk{background:#010101;box-shadow:0 8px 28px rgba(37,244,238,.28)}
.soc-tk svg{width:40px;height:40px}
.soc-hint{color:var(--ink);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.85rem,1.6vw,1.05rem);opacity:.9;padding-bottom:3px;border-bottom:1px solid var(--line)}
.soc-hint::before{content:"↑";display:inline-block;margin-inline-end:8px;color:#e91e8c;animation:hintBob 1.6s ease-in-out infinite}
#at2{max-width:560px;text-align:center;font-weight:300;line-height:1.8;opacity:.85;font-size:clamp(.95rem,1.8vw,1.15rem)}
#how{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 20px 80px}
.steps{list-style:none;width:100%;max-width:48rem}
.steps li{display:flex;gap:20px;align-items:flex-start;padding:24px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .n{font-weight:900;line-height:1;font-size:clamp(2.2rem,8vw,4rem);min-width:1.4em}
.steps h3{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.2vw,1.5rem);margin-bottom:8px}
.steps p{font-weight:300;line-height:1.7;opacity:.75;font-size:clamp(.9rem,1.6vw,1.1rem)}
.cta{display:flex;justify-content:center;margin-top:20px}
@media(min-width:640px){nav{padding:28px 40px 0}nav a{font-size:1.1rem}.lg{width:96px}h1{font-size:14vw}.bar{padding:0 40px 32px}.bar p{max-width:220px}.portrait{--w:420px}.cube{padding:22px;border-radius:36px}}
@media(min-width:768px){h1{font-size:14.8vw}.bar p{max-width:260px}.portrait{--w:520px}}
@media(min-width:900px){.cubes{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){h1{font-size:16vw}nav a{font-size:1.4rem}.portrait{--w:520px}}
/* ===== animations ===== */
:root{--wa:#25D366}
/* hero: shimmering gradient title */
h1.hh{background-size:100% 200%;animation:shimmer 6s ease-in-out infinite alternate}
@keyframes shimmer{from{background-position:0 0}to{background-position:0 100%}}
/* floating logo */
.mag{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* nav + toggles entrance */
.tg{animation:popIn .8s .6s cubic-bezier(.22,1,.36,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
/* button shine sweep */
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 3.6s 1.5s ease-in-out infinite;z-index:-1}
@keyframes sweep{0%{left:-60%}55%,100%{left:140%}}
.btn:active{transform:scale(.96)}
/* cards: staggered entrance + hover lift + glow */
.cube{transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s,border-color .45s,opacity .9s cubic-bezier(.22,1,.36,1),filter .9s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
.cube::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 0%,rgba(187,204,215,.22),transparent 60%);opacity:0;transition:opacity .45s}
.cube:hover{transform:translateY(-8px) scale(1.02)!important;border-color:var(--g2);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.cube:hover::before{opacity:1}
.cube>*{position:relative}
/* steps: slide in + number pop */
.steps li{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),filter .9s}
.steps li.in .n{animation:numPop .8s .15s cubic-bezier(.34,1.56,.64,1) both}
@keyframes numPop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* ===== extra motion ===== */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22) 0%,rgba(255,255,255,.07) 35%,transparent 68%);will-change:left,top,transform;transition:left var(--t,2.2s) linear,top var(--t,2.2s) linear,transform var(--t,2.2s) linear}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.4;box-shadow:0 0 4px rgba(255,255,255,.7);animation:twinkle var(--d,1.4s) ease-in-out infinite alternate}
.star.s2{width:3px;height:3px;opacity:.55}
.star.s3{width:1.5px;height:1.5px;opacity:.28}
@keyframes twinkle{from{opacity:.12;transform:scale(.75)}to{opacity:.85;transform:scale(1.25)}}
main{position:relative;z-index:1}
.tg{z-index:50}
nav{animation:navDrop .9s .2s cubic-bezier(.22,1,.36,1) both}
@keyframes navDrop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.portrait{animation:logoIn 1.3s .4s cubic-bezier(.22,1,.36,1) both}
@keyframes logoIn{from{opacity:0;transform:translateY(50px) scale(.8)}to{opacity:1;transform:none}}
h2[data-f]{letter-spacing:.03em;transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),letter-spacing 1.4s cubic-bezier(.22,1,.36,1)}
h2[data-f].in{letter-spacing:-.025em}
.btn{transition:opacity .2s,background .2s,color .2s,transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s}
.btn:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.3)}

.steps li:hover{transform:translateX(10px)!important}
html[dir=rtl] .steps li:hover{transform:translateX(-10px)!important}
.steps li .n{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.steps li:hover .n{transform:scale(1.15) rotate(-4deg)}
.cube::after{content:"";position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);pointer-events:none}
.cube:hover::after{animation:sweep 1s ease-out}
.cube h3{transition:transform .4s cubic-bezier(.22,1,.36,1)}
.cube:hover h3{transform:translateY(-4px)}
@media(prefers-reduced-motion:reduce){nav,.portrait,.star,.ticker-track,.tg button::before{animation:none!important}.orb{transition:none!important}#at span{opacity:1!important}}
/* ===== WhatsApp: pulse + green glow ===== */
.wa-ic{position:relative;isolation:isolate;animation:waGlow 2.4s ease-in-out infinite}
.wa-ic::before,.wa-ic::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(37,211,102,.6) 0%,rgba(37,211,102,.3) 40%,rgba(37,211,102,0) 70%);opacity:0;z-index:-1;animation:waRing 2.4s ease-out infinite;pointer-events:none}
.wa-ic::after{animation-delay:1.2s}
.wa-ic svg{animation:waBeat 2.4s ease-in-out infinite;transition:transform .3s}
.wa-ic:hover svg{animation-play-state:paused;transform:scale(1.15) rotate(-8deg)}
@keyframes waRing{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.8);opacity:0}}
@keyframes waGlow{0%,100%{box-shadow:0 0 14px 2px rgba(37,211,102,.22),0 0 36px 6px rgba(37,211,102,.1)}10%{box-shadow:0 0 26px 6px rgba(37,211,102,.45),0 0 60px 14px rgba(37,211,102,.2)}40%{box-shadow:0 0 16px 3px rgba(37,211,102,.26),0 0 40px 8px rgba(37,211,102,.12)}}
@keyframes waBeat{0%,100%{transform:scale(1)}10%{transform:scale(1.13)}20%{transform:scale(1)}30%{transform:scale(1.07)}42%{transform:scale(1)}}
/* Instagram glow — soft, behind icon */
.soc-ig{animation:igGlow 2.4s ease-in-out infinite}
.soc-ig::before,.soc-ig::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(214,36,159,.55) 0%,rgba(214,36,159,.25) 40%,rgba(214,36,159,0) 70%);opacity:0;z-index:-1;animation:waRing 2.4s ease-out infinite;pointer-events:none}
.soc-ig::after{animation-delay:1.2s}
.soc-ig svg{animation:waBeat 2.4s ease-in-out infinite}
.soc-ig:hover svg{animation-play-state:paused}
@keyframes igGlow{0%,100%{box-shadow:0 0 14px 2px rgba(214,36,159,.22),0 0 36px 6px rgba(214,36,159,.1)}10%{box-shadow:0 0 24px 5px rgba(214,36,159,.4),0 0 50px 12px rgba(214,36,159,.18)}40%{box-shadow:0 0 16px 3px rgba(214,36,159,.26),0 0 40px 8px rgba(214,36,159,.12)}}
/* TikTok glow — soft cyan/blue, behind icon */
.soc-tk{animation:tkGlow 2.4s ease-in-out infinite}
.soc-tk::before,.soc-tk::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(37,244,238,.55) 0%,rgba(37,244,238,.25) 40%,rgba(37,244,238,0) 70%);opacity:0;z-index:-1;animation:waRing 2.4s ease-out infinite;pointer-events:none}
.soc-tk::after{animation-delay:1.2s}
.soc-tk svg{animation:waBeat 2.4s ease-in-out infinite}
.soc-tk:hover svg{animation-play-state:paused}
@keyframes tkGlow{0%,100%{box-shadow:0 0 14px 2px rgba(37,244,238,.22),0 0 36px 6px rgba(37,244,238,.1)}10%{box-shadow:0 0 24px 5px rgba(37,244,238,.4),0 0 50px 12px rgba(37,244,238,.18)}40%{box-shadow:0 0 16px 3px rgba(37,244,238,.26),0 0 40px 8px rgba(37,244,238,.12)}}
.btn{animation:btnLit 2s ease-in-out infinite}
.btn:hover{animation:none}
@keyframes btnLit{0%,100%{opacity:.7;text-shadow:none;box-shadow:0 0 0 0 transparent}50%{opacity:1;text-shadow:0 0 10px currentColor,0 0 22px currentColor;box-shadow:0 0 16px 2px var(--line),inset 0 0 12px var(--line)}}
@media(prefers-reduced-motion:reduce){.btn{animation:none}}
.wa-hint{color:var(--ink);text-decoration:none;font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(.85rem,1.6vw,1.05rem);opacity:.9;padding-bottom:3px;border-bottom:1px solid var(--line);transition:color .25s,border-color .25s}
.wa-hint::before{content:"↑";display:inline-block;margin-inline-end:8px;color:#25D366;animation:hintBob 1.6s ease-in-out infinite}
.wa-hint:hover{color:#25D366;border-color:#25D366}
@keyframes hintBob{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){[data-f]{transition:none;filter:none}.wa-hint::before,.soc-hint::before{animation:none}html{scroll-behavior:auto}h1.hh,.mag,.tg,.btn::after,.tg button.pulse,.wa-ic,.wa-ic::before,.wa-ic::after,.wa-ic svg,.soc-ig,.soc-ig::before,.soc-ig::after,.soc-ig svg,.soc-tk,.soc-tk::before,.soc-tk::after,.soc-tk svg{animation:none!important}.wa-ic{box-shadow:0 0 24px rgba(37,211,102,.6)}.soc-ig{box-shadow:0 0 24px rgba(214,36,159,.55)}.soc-tk{box-shadow:0 0 24px rgba(0,242,234,.5)}.wa-ic::before,.wa-ic::after,.soc-ig::before,.soc-ig::after,.soc-tk::before,.soc-tk::after{display:none}}

.bar{padding-bottom:18px}
#mq{padding:42px 0 24px;gap:8px}
.row{gap:8px}
#about{gap:24px;padding:42px 16px}

.wa-ic svg{width:42px;height:42px}

.social-row{gap:14px}
.soc{width:58px;height:58px}

 nav{padding-top:20px}
 h1{margin-top:28px}
 #mq{padding:52px 0 28px}

@media(max-width:639px){
  #hero{min-height:0;}

  h1{margin-top:14px;line-height:.95;}
  .btn{padding:11px 26px;}

function goTo(id){const el=document.getElementById(id);if(!el)return;const y0=scrollY,t0=performance.now(),dur=Math.min(1600,Math.max(700,Math.abs(el.getBoundingClientRect().top)*.45)),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 R.style.scrollBehavior='auto';
 const step=now=>{const p=Math.min(1,(now-t0)/dur),r=el.getBoundingClientRect(),target=r.top+scrollY-(innerHeight-r.height)/2;window.scrollTo(0,y0+(target-y0)*ease(p));if(p<1)requestAnimationFrame(step);else R.style.scrollBehavior=''};
 requestAnimationFrame(step)}
document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();goTo(a.dataset.go)}));

// ---- Thank-you video: chroma key + play with sound when scrolled into view ----
(function(){
const kv=document.getElementById('kv'),kc=document.getElementById('kc'),snd=document.getElementById('snd'),kit=document.getElementById('kit');
const kx=kc.getContext('2d',{willReadFrequently:true});
let inView=false,looping=false;
function key(){if(!kv.videoWidth)return;if(kc.width!==kv.videoWidth){kc.width=kv.videoWidth;kc.height=kv.videoHeight}
 const W=kc.width,H=kc.height;kx.drawImage(kv,0,0,W,H);const im=kx.getImageData(0,0,W,H),d=im.data;
 for(let i=0;i<d.length;i+=4){const g=d[i+1],m=d[i]>d[i+2]?d[i]:d[i+2],k=g-m;
  if(k>18){let a=1-(k-18)/42;if(a<0)a=0;d[i+3]=a*255;d[i+1]=m}}
 kx.putImageData(im,0,0)}
function loop(){if(!inView){looping=false;return}key();if(kv.requestVideoFrameCallback)kv.requestVideoFrameCallback(loop);else requestAnimationFrame(loop)}
function start(){if(!looping){looping=true;loop()}if(!kv.paused)return;kv.muted=false;
 const pr=kv.play();if(pr&&pr.then)pr.then(()=>{snd.hidden=true}).catch(()=>{kv.muted=true;const p2=kv.play();if(p2&&p2.catch)p2.catch(()=>{});})}
function unmute(){if(inView&&kv.muted){kv.muted=false;const p=kv.play();if(p&&p.catch)p.catch(()=>{});snd.hidden=true}}
kv.addEventListener('loadeddata',key);
new IntersectionObserver(es=>es.forEach(e=>{inView=e.isIntersecting&&e.intersectionRatio>=.4;if(inView)start();else kv.pause()}),{threshold:[0,.4,.7,1]}).observe(kit);
let primed=false;
['click','pointerup','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!primed){primed=true;if(!inView){kv.muted=true;const p=kv.play();if(p&&p.then)p.then(()=>{if(!inView)kv.pause()}).catch(()=>{})}}unmute()},{passive:true}));
snd.addEventListener('click',unmute);
})();
</script>
<script id="tv-intro-js">
(function(){
  var root=document.documentElement, box=document.getElementById("tvIntro"), v=document.getElementById("tvIntroVideo"), done=false, url=null;
  function finish(){
    if(done) return; done=true;
    root.classList.remove("tv-intro-on");
    try{window.scrollTo(0,0);}catch(e){}
    if(box){ box.classList.add("tv-out"); setTimeout(function(){ try{box.remove();}catch(e){} if(url) URL.revokeObjectURL(url); },900); }
  }
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ finish(); return; }
    var LAND="intro-land.mp4", PORT="intro-port.mp4";
    v.muted=true; v.defaultMuted=true; v.src=(window.innerHeight>window.innerWidth)?PORT:LAND;
    v.addEventListener("ended",finish);
    (function watch(){ if(done) return; if(v.duration && v.currentTime>=v.duration-0.35){ finish(); return; } requestAnimationFrame(watch); })();
    v.addEventListener("error",finish);
    var p=v.play(); if(p&&p.catch) p.catch(finish);
    setTimeout(finish,9000);
  }catch(e){ finish(); }
})();
</script>
